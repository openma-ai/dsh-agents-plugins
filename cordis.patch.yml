# One bundle, one bridge kernel. Platform and component capabilities stay as
# separate Cordis rows so each contribution has its own lifecycle and failure.

- insert:
    - id: plugin-bridge-kernel
      name: '@openma/dsh-agents-plugins-bridge'

    - id: plugin-bridge-format-agent-plugins-v1
      name: '@openma/dsh-agents-plugins-bridge/providers/agent-plugins-v1'

    - id: plugin-bridge-format-codex-legacy
      name: '@openma/dsh-agents-plugins-bridge/providers/codex-legacy'

    - id: plugin-bridge-format-claude-code-legacy
      name: '@openma/dsh-agents-plugins-bridge/providers/claude-code-legacy'

    - id: plugin-bridge-format-pi-package
      name: '@openma/dsh-agents-plugins-bridge/providers/pi-package'

    - id: plugin-bridge-marketplace-codex
      name: '@openma/dsh-agents-plugins-bridge/marketplaces/codex'

    - id: plugin-bridge-marketplace-claude-code
      name: '@openma/dsh-agents-plugins-bridge/marketplaces/claude-code'

    - id: plugin-bridge-discovery-codex
      name: '@openma/dsh-agents-plugins-bridge/discovery/codex'

    - id: plugin-bridge-discovery-claude-code
      name: '@openma/dsh-agents-plugins-bridge/discovery/claude-code'

    - id: plugin-bridge-discovery-pi-user
      name: '@openma/dsh-agents-plugins-bridge/discovery/pi'

    - id: plugin-bridge-discovery-pi-project
      name: '@openma/dsh-agents-plugins-bridge/discovery/pi'
      config:
        settingsPath: .pi/settings.json
        scope: project

    - id: plugin-bridge-discovery-codex-marketplaces
      name: '@openma/dsh-agents-plugins-bridge/discovery/codex-marketplaces'

    - id: plugin-bridge-discovery-claude-code-marketplaces
      name: '@openma/dsh-agents-plugins-bridge/discovery/claude-code-marketplaces'

    - id: plugin-bridge-adapter-skills
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-skills'

    - id: plugin-bridge-adapter-mcp
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-mcp'

    - id: plugin-bridge-adapter-agent-plugins-mcp
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-agent-plugins-mcp'

    - id: plugin-bridge-adapter-hooks
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-hooks'

    - id: plugin-bridge-adapter-prompt-commands
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-prompt-commands'

    - id: plugin-bridge-adapter-pi-skills
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-pi-skills'

    - id: plugin-bridge-adapter-pi-extensions
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-pi-extensions'

    - id: plugin-bridge-adapter-themes
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-themes'

    - id: plugin-bridge-adapter-lsp
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-lsp'

    - id: plugin-bridge-adapter-codex-apps
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-codex-apps'

    - id: plugin-bridge-adapter-claude-agents
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-claude-agents'

    - id: plugin-bridge-adapter-output-styles
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-output-styles'

    - id: plugin-bridge-adapter-claude-monitors
      name: '@openma/dsh-agents-plugins-bridge/adapters/dsh-claude-monitors'

    - id: plugin-bridge-runtime
      name: '@openma/dsh-agents-plugins-bridge/runtime'

    - id: plugin-bridge-command
      name: '@openma/dsh-agents-plugins-bridge/command'

    # One-install adaptive surface. It stays active but mounts no children on
    # TUI; on Web it mounts the Host gateway and Browser client as Loader
    # children, preserving both faces as independent plugin entries.
    - id: plugin-bridge-ui-auto
      name: '@openma/dsh-agents-plugins-bridge/ui-auto'
